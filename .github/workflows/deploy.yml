name: Deploy

# Pushing a tag v<version> deploys the Worker with `wrangler deploy` after check, tests and build;
# the Actions tab offers a manual run. Needs the repo secrets CLOUDFLARE_API_TOKEN (token template
# "Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID; without them the deploy step is skipped, so
# the template itself, which has no Worker, stays green. Runtime secrets live on the Worker:
# `npx wrangler secret put <KEY>`. Pull requests get a Worker Preview from preview.yml instead.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency: deploy

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    name: Check, test, build, deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Format, lint, types
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy

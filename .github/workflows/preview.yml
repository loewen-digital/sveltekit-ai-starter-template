name: Preview

# One Worker Preview per pull request, named `pr-<number>`, under the production Worker. It gets
# only the bindings of the `previews` block in the Wrangler config, never production's. The URL
# lands as a comment on the PR and follows every push; the Preview is deleted when the PR closes.
# Needs the repo secrets CLOUDFLARE_API_TOKEN (token template "Edit Cloudflare Workers") and
# CLOUDFLARE_ACCOUNT_ID; without them every step after the checkout is skipped. Secrets a Preview
# needs at runtime are set once for all Previews: `npx wrangler preview base-config secret put <KEY>`.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
  # The directory with the Wrangler config: `.` for an app at the root, `apps/web` in a monorepo.
  APP_DIR: .

jobs:
  deploy:
    name: Deploy Preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''

      - run: npm run build
        if: env.CLOUDFLARE_API_TOKEN != ''

      # `--json` prints one JSON object; `.preview.urls[0]` is the Preview URL, as in Cloudflare's own
      # GitHub Actions example (developers.cloudflare.com/workers/previews/automation-examples/).
      - name: Deploy the Preview
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx wrangler preview --cwd "$APP_DIR" --name "$PREVIEW_NAME" --message "${{ github.event.pull_request.head.sha }}" --json \
            | tee "$RUNNER_TEMP/wrangler-preview.json"

      - name: Comment the URL on the PR
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(jq -er '.preview.urls[0]' "$RUNNER_TEMP/wrangler-preview.json" 2>/dev/null || true)
          [ -n "$url" ] || url=$(grep -oE 'https://[^" ]+\.workers\.dev[^" ]*' "$RUNNER_TEMP/wrangler-preview.json" | head -1)
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none \
            --body "Preview: ${url:-see the workflow log} (\`$PREVIEW_NAME\`, ${{ github.event.pull_request.head.sha }})"

  delete:
    name: Delete Preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''

      - name: Delete the Preview
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler preview delete --cwd "$APP_DIR" --name "$PREVIEW_NAME" --skip-confirmation
